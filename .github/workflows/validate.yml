name: Validate website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report dependency advisories
        run: npm audit --audit-level=critical

      - name: Gate production dependencies at high severity
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck website
        run: npm run typecheck

      - name: Typecheck Netlify functions
        run: npx tsc --noEmit --target ES2020 --module ESNext --moduleResolution bundler --lib ES2020,DOM --skipLibCheck netlify/functions/netlify-env.d.ts netlify/functions/concierge.mts

      - name: Build
        run: npm run build

      - name: Verify built-site integrity
        run: npm run validate:build
