name: Free site audit

on:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run audit
      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-report
          path: |
            playwright-report
            test-results
          retention-days: 14
